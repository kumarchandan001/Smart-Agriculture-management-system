version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: smart_agri_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - smart_agri_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: smart_agri_ml
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    networks:
      - smart_agri_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_agri_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/smart_agri
      - ML_SERVICE_URL=http://ml-service:5001
      - JWT_SECRET=supersecret_production_jwt_key_smart_agri_2026
      - JWT_EXPIRES_IN=7d
      - MARKET_API_KEY=your_data_gov_in_api_key_here
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - smart_agri_network

  frontend:
    build:
      context: ./smart-agro
      dockerfile: Dockerfile
    container_name: smart_agri_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - smart_agri_network

volumes:
  mongo_data:
    driver: local

networks:
  smart_agri_network:
    driver: bridge
